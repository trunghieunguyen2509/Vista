{% extends "layouts.html" %}
{% block content %}
<section class="auth-section">
    <div class="auth-panel">
    <div class="auth-brand">
        <img src="/static/images/vista-logo.webp" alt="" class="auth-brand-logo">
        <h1>Join Vista</h1>
        <p>Create an account to save your details and check out faster.</p>
    </div>

        <div class="auth-form-wrap">
            <form class="auth-form" method="POST" id="register-form">
                <h2>Create Account</h2>
                <p class="auth-subtitle">It only takes a minute.</p>

                {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}

                <div class="auth-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>
                </div>

                <div class="auth-field">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" minlength="8" required>
                </div>

                <button type="submit" class="btn-primary auth-submit">Register</button>

                <p class="auth-switch">Already have an account? <a href="{{ url_for('login', next=request.args.get('next')) }}">Log In</a></p>
            </form>
        </div>
    </div>
</section>

<script>
    const registerForm = document.getElementById('register-form');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');

    function checkPasswordsMatch() {
        if (confirmPassword.value && password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Passwords do not match.');
        } else {
            confirmPassword.setCustomValidity('');
        }
    }

    password.addEventListener('input', checkPasswordsMatch);
    confirmPassword.addEventListener('input', checkPasswordsMatch);
</script>
{% endblock %}
