{% extends "layouts.html" %}
{% from "_macros.html" import item_row %}
{% block content %}
<section class="cart-list-section">
    <h2 class="section-title">Checkout</h2>
    <div class="cart-list">
        {% for item in cart_items %}
        {{ item_row(item) }}
        {% endfor %}
    </div>
    <div class="cart-summary">
        <span>Total</span>
        <strong>${{ '%.2f'|format(total_aud) }} AUD</strong>
    </div>
    <form method="POST" action="{{ url_for('checkout') }}">
        <p class="checkout-note">This is a demo checkout — no real payment will be processed.</p>
        <button type="submit" class="btn-primary cart-add-btn">Confirm Order</button>
    </form>
</section>
{% endblock %}
